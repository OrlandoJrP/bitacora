# ─────────────────────────────────────────────────────────────────────────────
# Bitácora — Spec de DigitalOcean App Platform (buildpack Node.js)
#
# Pégalo en: tu app → Settings → App Spec → Edit (reemplaza TODO el contenido).
# Antes de guardar, rellena AUTH_SECRET y ADMIN_INITIAL_PASSWORD.
#
# El job PRE_DEPLOY ejecuta migraciones + seed (idempotente) antes de cada deploy.
# La base Managed Postgres se adjunta como ${db.DATABASE_URL} con sslmode=require.
# Auth.js detecta el dominio solo (AUTH_TRUST_HOST=true), así funciona tanto en la
# URL temporal .ondigitalocean.app como luego en tu dominio.
# ─────────────────────────────────────────────────────────────────────────────
name: bitacora
region: nyc

databases:
  - name: db
    engine: PG
    version: "16"
    production: false # cámbialo a true para un clúster con backups automáticos

services:
  - name: web
    environment_slug: node-js
    github:
      repo: OrlandoJrP/bitacora
      branch: main
      deploy_on_push: true
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm build
    run_command: pnpm start
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    health_check:
      http_path: /login
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REEMPLAZA_CON_TU_SECRETO
      - key: AUTH_TRUST_HOST
        scope: RUN_TIME
        value: "true"

jobs:
  - name: migrate-seed
    kind: PRE_DEPLOY
    environment_slug: node-js
    github:
      repo: OrlandoJrP/bitacora
      branch: main
    build_command: corepack enable && pnpm install --frozen-lockfile
    run_command: pnpm db:migrate && pnpm db:seed
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        value: velasquezorlandodavid@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REEMPLAZA_CON_UNA_CLAVE_FUERTE
